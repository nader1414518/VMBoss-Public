name: Something isn't working
description: Tell us what went wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Which system were you running?
      placeholder: Windows 11, Ubuntu Desktop 26.04 LTS, Android 17…
  - type: input
    id: versions
    attributes:
      label: VM Boss and macOS versions
      description: VM Boss › About VM Boss, and Apple menu › About This Mac.
      placeholder: VM Boss 1.0.0, macOS 26.1, MacBook Pro M3
  - type: textarea
    id: log
    attributes:
      label: Event log
      description: Optional. In the machine's Settings, click Open Event Log and paste it here.
      render: text
